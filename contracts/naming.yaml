version: 1
sources:
  tables: backend/db/migrations/*.sql
  permissions: roles.md
  copy: conventions.md §12.2
  rules: conventions.md §6
rules:
  database_table:
    case: snake_case
    number: plural
    example: appointments
  database_column:
    case: snake_case
    example: visitor_id_no
  api_json_key:
    case: snake_case
    example: visitor_name
  backend_variable_function:
    case: camelCase
    example: visitorName
  backend_type:
    case: PascalCase
    example: VisitAppointment
  frontend_component_file:
    case: PascalCase
    example: GatePage.vue
  frontend_variable_function:
    case: camelCase
    example: visitStart
  route_file:
    case: kebab-case
    suffix: .routes.ts
    example: visitor-types.routes.ts
  permission:
    pattern: ^context:resource:action$
    example: visit:gate:verify
  copy_identifier:
    pattern: ^COPY-[0-9]{3}$
    range: COPY-001..COPY-407
  appointment_no:
    pattern: ^AP[0-9]{8}[0-9]{3}$
    example: AP20261012001
  short_code:
    pattern: ^[0-9]{6}$
    range: 100000-999999
  event:
    name: notification:new
    room: user:<id>
  timezone: Asia/Shanghai
  api_prefix: /api/v1
