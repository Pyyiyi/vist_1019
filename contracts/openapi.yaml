openapi: 3.0.3
info:
  title: 校园访客系统 V1.0 API
  version: 1.0.0
  description: 从 backend/src/modules/*/api/*.routes.ts 实际路由反写；89 个方法操作 / 72 个唯一路径。
  license:
    name: Proprietary
    url: https://github.com/Pyyiyi/vist_1019
servers:
- url: /api/v1
tags:
- name: access
  description: 认证、用户、角色与工作台
- name: visit
  description: 预约、审核、门卫与访客 H5
- name: master
  description: 主数据与系统参数
- name: notify
  description: 站内通知与渠道
- name: report
  description: 台账、在校清单与统计
- name: compliance
  description: 审计、隐私与信息副本
paths:
  /auth/csrf:
    get:
      tags:
      - access
      summary: 获取 CSRF 令牌
      description: 获取 CSRF 令牌
      operationId: get_auth_csrf
      security: []
      x-access: 公开
      x-authentication: public
      x-allowed-roles: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CsrfData'
                  required:
                  - data
          headers:
            Set-Cookie:
              description: vs.csrf 双提交 Cookie
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters: []
  /auth/login:
    post:
      tags:
      - access
      summary: 账号或工号登录
      description: 账号或工号登录
      operationId: post_auth_login
      security: []
      x-access: 公开
      x-authentication: public
      x-allowed-roles: []
