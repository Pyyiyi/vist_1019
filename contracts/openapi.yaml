components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vs.sid
      description: 后台会话 Cookie
    visitorBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 访客令牌 Bearer
    visitorCookie:
      type: apiKey
      in: cookie
      name: vs.visitor
      description: 访客令牌 Cookie
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
    Role:
      name: role
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
    DateFrom:
      name: date_from
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      schema:
        type: string
        format: date
    UnreadOnly:
      name: unread_only
      in: query
      schema:
        type: boolean
    Name:
      name: name
      in: query
      schema:
        type: string
    IdNo:
      name: id_no
      in: query
      schema:
        type: string
    Phone:
      name: phone
      in: query
      schema:
        type: string
    Host:
      name: host
      in: query
      schema:
        type: string
    Type:
      name: type
      in: query
      schema:
        type: string
    Granularity:
      name: granularity
      in: query
      schema:
        type: string
        enum:
        - day
        - week
        - month
    Format:
      name: format
      in: query
      schema:
        type: string
        enum:
        - csv
        - xlsx
    UserId:
      name: user_id
      in: query
      schema:
        type: string
    Action:
      name: action
      in: query
      schema:
        type: string
    ObjectType:
      name: object_type
      in: query
      schema:
        type: string
    ObjectId:
      name: object_id
      in: query
      schema:
        type: string
    IncludeInactive:
      name: include_inactive
      in: query
      schema:
        type: boolean
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PathCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    PathKey:
      name: key
      in: path
      required: true
      schema:
        type: string
  schemas:
    Envelope:
      type: object
      properties:
        code:
          type: integer
          description: 0 表示成功
        message:
          type: string
        data: {}
      required:
      - code
      - message
      - data
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: integer
          description: 非 0 错误码
        message:
          type: string
        data:
          type: object
          nullable: true
        field:
          type: string
      required:
      - code
      - message
      - data
    CsrfData:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role_code:
          type: string
          enum:
          - admin
          - guard
          - host
          - visitor
        host_id:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - inactive
      required:
      - id
      - username
      - display_name
      - role_code
    LoginData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    MeData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    LoggedOutData:
      type: object
      properties:
        logged_out:
          type: boolean
          enum:
          - true
      required:
      - logged_out
    ChangedData:
      type: object
      properties:
        changed:
          type: boolean
          enum:
          - true
      required:
      - changed
    Role:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
      required:
      - code
      - name
    Permission:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string
      required:
      - code
      - name
    RolePermissionsData:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
      - role
      - permissions
    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
      required:
      - items
      - total
      - page
      - page_size
    UserMutationData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    UserStatusData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - inactive
      required:
      - id
      - status
    ResetPasswordData:
      type: object
      properties:
        reset:
          type: boolean
          enum:
          - true
      required:
      - reset
    WorkbenchSummaryData:
      type: object
      properties:
        role:
          type: string
          enum:
          - admin
          - guard
          - host
        todo:
          type: object
          properties:
            pending_review:
              type: integer
            pending_verify:
              type: integer
            pending_incident:
              type: integer
          required:
          - pending_review
          - pending_verify
          - pending_incident
        kpi:
          type: object
          properties:
            today_appointments:
              type: integer
            on_campus:
              type: integer
          required:
          - today_appointments
          - on_campus
        unread_count:
          type: integer
        todos:
          type: array
          items:
            $ref: '#/components/schemas/WorkbenchTodo'
      required:
      - role
      - todo
      - kpi
      - unread_count
      - todos
    EntryQrData:
      type: object
      properties:
        entry_url:
          type: string
          format: uri
        qr_data_url:
          type: string
      required:
      - entry_url
      - qr_data_url
    Option:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - value
      - label
    VisitorType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
        sort_order:
          type: integer
      required:
      - id
      - code
      - name
      - status
