          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters: []
  /auth/logout:
    post:
      tags:
      - access
      summary: 退出登录
      description: 退出登录
      operationId: post_auth_logout
      security:
      - sessionCookie: []
      x-access: 已登录
      x-authentication: session
      x-allowed-roles:
      - admin
      - guard
      - host
