<script>
(function() {
  const NAT_W = 1800, NAT_H = 1150;
  const diagram = document.getElementById('diagram');
  const svg = diagram.querySelector('svg');
  const label = document.getElementById('zoom-label');
  const btnFit = document.getElementById('zoom-fit');
  const btnReset = document.getElementById('zoom-reset');
  let zoom = 1;

  function apply() {
    svg.setAttribute('width', Math.round(NAT_W * zoom));
    svg.setAttribute('height', Math.round(NAT_H * zoom));
    label.textContent = Math.round(zoom * 100) + '%';
    btnFit.classList.toggle('active', Math.abs(zoom - fitZoom()) < 0.01);
    btnReset.classList.toggle('active', Math.abs(zoom - 1) < 0.01);
  }

  function fitZoom() {
    const avail = diagram.clientWidth - 2;
    return Math.min(1, Math.max(0.1, avail / NAT_W));
  }

  function setZoom(z) { zoom = Math.min(4, Math.max(0.1, z)); apply(); }

  document.getElementById('zoom-in').addEventListener('click', function() { setZoom(zoom * 1.2); });
  document.getElementById('zoom-out').addEventListener('click', function() { setZoom(zoom / 1.2); });
  btnReset.addEventListener('click', function() { setZoom(1); });
  btnFit.addEventListener('click', function() { setZoom(fitZoom()); });

  // Ctrl/⌘ + wheel zooms; plain wheel scrolls natively.
  diagram.addEventListener('wheel', function(e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
    }
  }, { passive:false });

  // Drag to pan
  let dragging = false, startX = 0, startY = 0, startL = 0, startT = 0;
  diagram.addEventListener('pointerdown', function(e) {
    if (e.button !== 0) return;
    dragging = true; startX = e.clientX; startY = e.clientY;
    startL = diagram.scrollLeft; startT = diagram.scrollTop;
    diagram.classList.add('dragging', 'panning');
    diagram.setPointerCapture(e.pointerId);
  });
  diagram.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    diagram.scrollLeft = startL - (e.clientX - startX);
    diagram.scrollTop = startT - (e.clientY - startY);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    diagram.classList.remove('dragging', 'panning');
    try { diagram.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  diagram.addEventListener('pointerup', endDrag);
  diagram.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', function() {
    if (btnFit.classList.contains('active')) setZoom(fitZoom());
  });

  apply();

  // Hover tooltips
  const tip = document.getElementById('tip');
  const rects = document.querySelectorAll('rect.module-rect');
  rects.forEach(function(rect) {
    let sibling = rect.nextElementSibling;
    let title = '';
    while (sibling) {
      if (sibling.tagName === 'text' && sibling.getAttribute('font-weight') === 'bold') {
        title = sibling.textContent; break;
      }
      sibling = sibling.nextElementSibling;
    }
    rect.addEventListener('mouseenter', function() {
      tip.textContent = title || '模块';
      tip.style.opacity = '1';
    });
    rect.addEventListener('mousemove', function(e) {
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
    });
    rect.addEventListener('mouseleave', function() { tip.style.opacity = '0'; });
  });
})();
</script>
